name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node
    runs-on: ubuntu-latest

    # One run id for this whole job (#lzstalemanifest). The evidence files the
    # conformance rungs audit are written by the `npm test` step and read by
    # later, SEPARATE steps; each guard now requires the id stamped in the file
    # to equal this value, so a build/ directory restored from a cache, carried
    # in as an artifact, or left by any other invocation cannot stand in for
    # evidence of THIS run. `run_attempt` is part of it because re-running a
    # workflow reuses `run_id`, and a re-run is a different invocation.
    #
    # This is the env var the Makefile generates locally. It is set at JOB level
    # and not per step on purpose: the test step and the rung steps have to agree
    # on it, and a per-step value would guarantee they never could.
    env:
      LAZILY_CONFORMANCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lazily-spec is the canonical cross-language wire-protocol source. Clone
      # it as a sibling BEFORE any test step so every test file that reads
      # ../lazily-spec/conformance has the canonical fixtures — CI then
      # validates lazily-js against canonical fixtures and fails on drift
      # (#lzspecconf).
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      # The formatting gate (#lazilyformattinggate). AFTER the install, because
      # prettier is a pinned devDependency and `npm run format` resolves it from
      # node_modules — that resolution IS the pin. Running it before the install
      # would either fail outright or fall back to some other prettier, which is
      # the failure mode that reddened the dart and zig gates in this same series.
      - name: Format gate (make fmt)
        run: make fmt

      # `npm run build` is this repo's lint equivalent for the JS: it syntax-checks
      # every published entry point with `node --check` and regenerates the
      # size-limit budgets. There is no separate lint script.
      - name: Build (syntax check every entry point)
        run: npm run build

      # Declaration gate. `node --check` proves the JS *parses* and says nothing
      # about the hand-written `.d.ts` we publish alongside it, so a type error
      # in the shipped declarations was invisible to every green run — and it
      # breaks every TypeScript consumer. src/transport.d.ts carried four
      # TS2749s (the `IpcValue` const factory used in type position instead of
      # the `IpcValueValue` union) until this gate existed. Narrow by design:
      # declarations only, and `skipLibCheck` is off so the `.d.ts` are actually
      # checked rather than trusted.
      - name: Typecheck shipped declarations
        run: |
          npm run typecheck || { echo "::error::shipped .d.ts do not typecheck"; exit 1; }

          # A gate whose program is empty also exits 0. Require it to have really
          # loaded the shipped declarations.
          #
          # Three rules here, each of them measured rather than argued
          # (#lzgrepcpipefail). This line used to read
          #   files="$(... --listFiles | grep -c "$PWD/src/" || true)"
          # and every one of the three was wrong about something:
          #
          #   * `pwd -P`, not `$PWD`. tsc prints REALPATH'd absolute paths; `$PWD`
          #     keeps whatever symlink the shell was invoked through. Reached via
          #     a symlinked checkout the two strings never match, so tsc loaded
          #     all 47 declarations and the count was still 0 — the guard failed
          #     closed while naming the wrong subject entirely. That is the whole
          #     defect class: a measurement that can read 0 for a reason the
          #     diagnostic does not describe.
          #   * awk, not `grep -c`. `grep -c` prints 0 and EXITS 1 on zero
          #     matches, so the count arrives as a status, and under `set -e`
          #     (Actions' default shell is `bash -e {0}`) the assignment would die
          #     at this line before the diagnostic below could print. `|| true`
          #     silenced that, at the price of making "tsc produced nothing" and
          #     "the program has no src/ declarations" the same observation. awk
          #     exits 0 on zero matches, so the count stays a measurement.
          #   * tsc's own exit status is CHECKED. Behind a pipe it was invisible
          #     (this step sets no `pipefail`), so the only thing standing between
          #     a dead tsc and a misdiagnosis was the `npm run typecheck` above
          #     happening to fail first. Say it here instead of relying on that.
          #
          # `index()` and not a regex, so a `.`, `+` or `[` in the checkout path
          # is a character and not an operator.
          mkdir -p build
          ./node_modules/.bin/tsc -p tsconfig.json --listFiles > build/tsc-listing.txt || {
            echo "::error::tsc --listFiles exited nonzero — its file list cannot be trusted,"
            echo "::error::so the count below would describe a program that never loaded"
            exit 1; }
          root="$(pwd -P)"
          files="$(awk -v pre="$root/src/" 'index($0, pre) == 1 { n++ } END { print n + 0 }' build/tsc-listing.txt)"
          listed="$(awk 'END { print NR + 0 }' build/tsc-listing.txt)"
          echo "typechecked $files shipped declaration files"
          [ "$files" -gt 0 ] || {
            echo "::error::typecheck program contained no src/ declarations — it checked nothing"
            echo "::error::tsc listed $listed file(s), none of them under $root/src/"
            exit 1; }

      - name: Assert size budgets are committed and current
        run: npm run size:check

      # Absence guards. `npm test` must not be reachable with the sibling
      # missing or an area dark — a skipped fixture is not a passing fixture.
      - name: Assert canonical conformance fixtures are present (#lzspecconf)
        run: |
          test -d ../lazily-spec/conformance || {
            echo "::error::../lazily-spec/conformance missing — conformance replay would test nothing"; exit 1; }
          test -d ../lazily-spec/schemas || {
            echo "::error::../lazily-spec/schemas missing — schema-conformance tests cannot run"; exit 1; }
          for area in agent-doc collections coordination crdt-tree lossless-tree materialization \
                      membership message-passing presence rateshape reactive-graph \
                      reliable-sync resilience service statechart temporal windowing; do
            test -d "../lazily-spec/conformance/$area" || {
              echo "::error::../lazily-spec/conformance/$area missing"; exit 1; }
          done

      # Shadowing guard. An absence guard cannot catch a bundled copy: the
      # directory is present, the tests pass, and they are replaying a stale
      # local fixture. js carried nine of these until #lzspecconf.
      - name: Assert no bundled fixture copy shadows the canonical spec
        run: |
          if [ -d test/conformance ]; then
            echo "::error::test/conformance/ reintroduced — bundled fixtures shadow ../lazily-spec and hide drift"
            exit 1
          fi

      # Positive assertion. The guards above prove the fixtures are *available*;
      # this proves they were *read*. Capture the exit code explicitly and grep
      # the summary rather than trusting a clean tail — and require skipped == 0
      # plus a nonzero pass count, so a suite that silently stops replaying
      # fixtures fails instead of reporting green.
      - name: Test (assert fixtures actually ran)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          status=$?
          echo "npm test exit=$status"
          [ "$status" -eq 0 ] || { echo "::error::test suite failed"; exit 1; }

          grep -qE '^(ℹ|#) fail 0$' test-output.txt || {
            echo "::error::test summary does not report 'fail 0'"; exit 1; }
          grep -qE '^(ℹ|#) skipped 0$' test-output.txt || {
            echo "::error::tests were skipped — a skipped conformance fixture is not a passing one"
            grep -E '^(ℹ|#) skipped' test-output.txt; exit 1; }

          # awk, not `grep -oE ... | head -1`. This step sets `set -o pipefail`
          # and Actions' default shell is `bash -e {0}`, so an inner grep that
          # matched nothing poisoned the whole pipeline and `set -e` killed the
          # step AT THIS LINE — measured: zero output, exit 1, and the
          # `no passing tests reported` diagnostic below never printed. The guard
          # was written for exactly the state in which it went silent
          # (#lzgrepcpipefail). awk exits 0 on zero matches, so an absent summary
          # reaches the emptiness test as an empty string instead of as a status.
          #
          # Field comparison rather than a regex on purpose: `ℹ` is multi-byte and
          # the runner's awk is mawk, which is byte-oriented. `$1 == "ℹ"` is a
          # byte-equality test and behaves identically under mawk and gawk, where
          # `/^(ℹ|#) /` is making a promise about multi-byte regex support that
          # mawk does not keep.
          pass="$(awk '($1 == "ℹ" || $1 == "#") && $2 == "pass" && NF == 3 && $3 ~ /^[0-9]+$/ { print $3; exit }' test-output.txt)"
          [ -n "$pass" ] && [ "$pass" -gt 0 ] || {
            echo "::error::no passing tests reported — the suite ran nothing"; exit 1; }
          echo "passed $pass tests with 0 skipped"

          # Reactive-graph replay must be observable in the output, per model.
          # `fail 0 / skipped 0 / pass > 0` proves the suite ran; it does not
          # prove the reactive-graph corpus was replayed, nor that it was
          # replayed against every context. The dart/go cascade defect was
          # sync-clean and async-broken, so a run covering only the default
          # context is the exact hole this guard closes. Each model prints
          # "reactive-graph[<model>]: replayed N fixtures, ..." and N must be
          # nonzero.
          # nonzero. awk and not `grep -oE ... | head -1`, and this site is the
          # sharpest instance of the class in the repo (#lzgrepcpipefail): under
          # this step's `set -o pipefail` plus the default `bash -e {0}`, a model
          # whose replay line was ABSENT made the inner grep exit 1, poisoned the
          # pipeline, and killed the step at the assignment. Measured against a
          # real run's output with the AsyncContext line removed: the step printed
          # `reactive-graph[Context]: 15 fixtures replayed` and then stopped dead,
          # exit 1, with no diagnostic whatsoever. The one message an operator
          # needed — `corpus was not replayed against AsyncContext` — was the one
          # the shell destroyed, in the precise sync-clean/async-broken state this
          # guard exists to name. awk exits 0 on zero matches, so absence arrives
          # as an empty string and the diagnostic survives to print.
          #
          # `$1 == tag` is a string comparison, which also retires the bracket
          # expression the old pattern smuggled in: `reactive-graph\[$model\]`
          # only escaped those brackets by hand, one edit away from becoming a
          # character class that matches none of the three models.
          for model in Context AsyncContext ThreadSafeContext; do
            n="$(awk -v tag="reactive-graph[$model]:" \
                   '$1 == tag && $2 == "replayed" && $3 ~ /^[0-9]+$/ { print $3; exit }' \
                   test-output.txt)"
            [ -n "$n" ] || {
              echo "::error::reactive-graph corpus was not replayed against $model"; exit 1; }
            [ "$n" -gt 0 ] || {
              echo "::error::reactive-graph[$model] replayed 0 fixtures — it tested nothing"; exit 1; }
            echo "reactive-graph[$model]: $n fixtures replayed"
          done

      - name: Formal model check
        run: npm run test:formal

      # The cross-binding wire-compatibility gate, which `make check` runs and no
      # binding's CI did (#lzinteroppeerci). Nine bindings have to agree on a byte
      # layout; a gate that only ever ran on a laptop is how they stop agreeing
      # without anyone finding out.
      - name: Interop peer self-check (#lzinteroppeerci)
        run: npm run test:interop-peer

      # ---------------------------------------------------------------------
      # Conformance ladder, rungs 1-4 (#lzguardsnotinci).
      #
      # `make check` runs these four rungs locally; CI ran only `npm test` and
      # therefore enforced NONE of them. A guard that exists in the repo and
      # never runs on a push is not a guard, it is a comment — the whole point
      # of this ladder is to reject exactly that kind of unproven claim, so it
      # cannot be exempt from it.
      #
      #   rung 1  scripts/check-conformance-coverage.sh  — fixture FILE opened
      #   rung 0  scripts/check-assertion-keys.mjs       — every assertion BLOCK
      #                                                    was instrumented at all
      #   rung 2  scripts/check-assertion-keys.mjs       — every key READ
      #   rung 3  scripts/check-assertion-keys.mjs       — every key ASSERTED
      #   rung 4  scripts/check-scenario-coverage.mjs    — every SCENARIO replayed
      #
      # Rungs 2 and 3 are the two halves of one script and are invoked as one
      # step, exactly as the Makefile invokes them.
      #
      # None of these run inside `npm test`. Each audits an evidence file the
      # recorder (`test/support/conformance-manifest.cjs`, a CJS `--require`
      # preload) writes DURING `npm test`, and the recorder is a no-op unless
      # the three manifest env vars are set. The `test` script in package.json
      # sets all three and truncates all three before `node --test`, so the
      # "Test (assert fixtures actually ran)" step above is what produces the
      # evidence these steps read — same as locally, where `make check` runs
      # `npm test` before the guards. No env var is set here for that reason:
      # setting one HERE and not there would point the guards at a file the
      # recorder never wrote.
      # ---------------------------------------------------------------------

      # The evidence must exist before anything audits it. Each guard already
      # fails on an absent or empty manifest, but that failure reads as "the
      # guard is broken"; this names the real cause — the recorder was not
      # attached to the test run — and proves the coupling between the test
      # step and these steps is live rather than assumed.
      # Freshness is checked here as well as inside every guard
      # (#lzstalemanifest), because this step is where the coupling between the
      # test step and the rungs is asserted rather than assumed, and "the file
      # exists" was the whole of that assertion. Two dimensions: the stamp must
      # be this job's LAZILY_CONFORMANCE_RUN_ID, and the file must hold at least
      # one RECORD below the stamp — `npm test` writes the stamp while truncating,
      # before the suite runs, so a stamp-only file passes `test -s` and proves
      # nothing.
      - name: Assert the conformance recorder produced evidence (#lzguardsnotinci)
        run: |
          test -n "$LAZILY_CONFORMANCE_RUN_ID" || {
            echo "::error::LAZILY_CONFORMANCE_RUN_ID is empty — the job-level env is gone,"
            echo "::error::and every rung below would refuse its evidence (#lzstalemanifest)."
            exit 1; }
          for f in build/conformance-fixtures-loaded.txt \
                   build/conformance-assertion-keys.txt \
                   build/conformance-assertion-blocks.txt \
                   build/conformance-scenarios.txt; do
            test -s "$f" || {
              echo "::error::$f is missing or empty — \`npm test\` ran without the"
              echo "::error::conformance recorder preloaded, so rungs 1-4 below would be"
              echo "::error::auditing nothing. Check the \`test\` script in package.json."
              exit 1; }
            stamped="$(head -n 1 "$f")"
            [ "$stamped" = "# lazily-run-id $LAZILY_CONFORMANCE_RUN_ID" ] || {
              echo "::error::$f is not evidence of THIS run (#lzstalemanifest)."
              echo "::error::first line: $stamped"
              echo "::error::wanted:     # lazily-run-id $LAZILY_CONFORMANCE_RUN_ID"
              exit 1; }
            records="$(tail -n +2 "$f" | grep -c . || true)"
            [ "$records" -gt 0 ] || {
              echo "::error::$f holds this run's id and ZERO records — the recorder wrote"
              echo "::error::nothing, so rungs 1-4 would audit an empty ledger."
              exit 1; }
            echo "$f: $records record(s), stamped $LAZILY_CONFORMANCE_RUN_ID"
          done

      # All three guards exit 0 with `SKIP:` when ../lazily-spec/conformance is
      # absent, so that they stay usable in a checkout without the sibling. In
      # CI that escape hatch is a vacuous green, and the clone + presence guard
      # above is what closes it — this greps for the skip line anyway, so the
      # two can never drift apart silently.
      - name: Rung 1 — canonical fixtures were OPENED (#portconformancecoverage)
        run: |
          set -o pipefail
          ./scripts/check-conformance-coverage.sh 2>&1 | tee rung1.txt
          grep -q '^SKIP:' rung1.txt && {
            echo "::error::rung 1 skipped — the canonical corpus was not found, so it checked nothing"
            exit 1; }
          exit 0

      - name: Rungs 2-3 — assertion keys were READ and ASSERTED (#lzassertunknownkeys, #lzconsumednotasserted)
        run: |
          set -o pipefail
          node scripts/check-assertion-keys.mjs 2>&1 | tee rung23.txt
          grep -q '^SKIP:' rung23.txt && {
            echo "::error::rungs 2-3 skipped — the canonical corpus was not found, so they checked nothing"
            exit 1; }
          exit 0

      - name: Rung 4 — every fixture SCENARIO was replayed (#lzscenariocoverage)
        run: |
          set -o pipefail
          node scripts/check-scenario-coverage.mjs 2>&1 | tee rung4.txt
          grep -q '^SKIP:' rung4.txt && {
            echo "::error::rung 4 skipped — the canonical corpus was not found, so it checked nothing"
            exit 1; }
          exit 0

      - name: Assertion observation ordering (#lzassertordering)
        run: python3 ../lazily-spec/scripts/check-assertion-ordering.py --binding js --root .

      # Rung 5 — a fixture flag may not reach a boolean position by COERCION
      # (#lzsiblingrunnermasking). Unlike rungs 1-4 this one reads no evidence
      # file: it derives the flag vocabulary from the corpus and walks the test
      # sources' AST, so it is independent of whether `npm test` ran. It skips
      # when the corpus is absent, and the grep below closes that escape hatch
      # here exactly as it does for the rungs above.
      - name: Rung 5 — fixture flags are type-required, not coerced (#lzsiblingrunnermasking)
        run: |
          set -o pipefail
          node scripts/check-flag-hygiene.mjs 2>&1 | tee rung5.txt
          grep -q '^SKIP:' rung5.txt && {
            echo "::error::rung 5 skipped — the canonical corpus was not found, so the flag vocabulary was empty"
            exit 1; }
          exit 0

      # The gate that keeps every step above honest (#lzcheckcireachguard). It
      # compares `make check`'s prerequisite closure against the run: bodies in
      # this file and fails on any target CI does not reach. Comments inside run:
      # bodies are stripped first — a naive grep for "make check" reported all
      # nine bindings as covered and every one of those hits was a comment.
      - name: CI-reachability guard (#lzcheckcireachguard)
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }
