name: Realtime View conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lazily-js
    env:
      LAZILY_REQUIRE_REALTIME_VIEW_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: lazily-js
      - uses: actions/checkout@v4
        with:
          repository: lazily-hub/lazily-spec
          ref: "6b3a686c1931a88cd5e6fb23c21618481ad0dc74"
          path: lazily-spec
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run generate:protobuf
      - run: npm run typecheck
      - run: node --test test/realtime-view.test.ts
