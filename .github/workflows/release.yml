name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm (OIDC trusted publishing)
    runs-on: ubuntu-latest
    # OIDC trusted publishing: no long-lived NPM_TOKEN. Register this workflow
    # once from an npm account with package write access and 2FA enabled:
    #
    # npm trust github @lazily-hub/lazily-js \
    #   --repo lazily-hub/lazily-js \
    #   --file release.yml \
    #   --allow-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          path: lazily-js

      # The conformance / schema tests replay fixtures from the lazily-spec sibling
      # (../lazily-spec). Check it out alongside so `npm test` passes in CI.
      - uses: actions/checkout@v6
        with:
          repository: lazily-hub/lazily-spec
          path: lazily-spec

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
      # Node 24 on the GitHub-hosted runner satisfies both requirements.
      - name: Show trusted-publishing toolchain
        run: npm --version

      - name: Install dependencies
        working-directory: lazily-js
        run: npm ci

      - name: Test
        working-directory: lazily-js
        run: npm test

      # Publish as `latest`. The accidental v1.x versions that forced the old
      # `prev` dist-tag workaround have been removed (npm now shows only the
      # 0.4.0 / 0.5.0 / 0.6.x line, latest = 0.6.1), so the v0.x line is the
      # canonical latest again.
      - name: Publish
        working-directory: lazily-js
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@lazily-hub/lazily-js@${version}" version >/dev/null 2>&1; then
            echo "@lazily-hub/lazily-js@${version} already published — idempotent no-op"
            exit 0
          fi
          # npm exchanges the GitHub OIDC token for a short-lived publish token.
          # Provenance is generated automatically for this public package/repo.
          npm publish --access public
          echo "published @lazily-hub/lazily-js@${version}"
